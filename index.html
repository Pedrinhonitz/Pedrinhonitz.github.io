<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Henrique Klein</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="icon/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="icon/icon-aba-page.png" type="image/png">
</head>
<body>
    <div id="content"></div>
    <div class="fab-stack">
        <button id="theme-toggle" type="button" aria-label="Mudar para tema escuro">
            <svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.2 6.2l1.4 1.4M16.4 16.4l1.4 1.4M6.2 17.8l1.4-1.4M16.4 7.6l1.4-1.4"></path>
            </svg>
            <svg class="icon-dark" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z"></path>
            </svg>
        </button>
    </div>
    <div class="lightbox" id="lightbox" hidden>
        <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
        <img id="lightbox-image" alt="">
        <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>
    <script src="./js/script.js"></script>
</body>
</html>
